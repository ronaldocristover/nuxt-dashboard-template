name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the point of a CI run.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches the two failures typechecking cannot: a key added to en.json and
      # forgotten elsewhere, and a dropped {placeholder} that would render raw.
      - name: Locale parity
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # The build must not depend on a real secret, but the server refuses to
          # start auth without one — so give it a throwaway of the right length.
          NUXT_SESSION_PASSWORD: ci-placeholder-session-password-32ch
